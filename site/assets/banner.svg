  <g opacity=".16" fill="none" stroke="#fb7185" stroke-width="1.2" color="#fb7185"><path d="M765 158h54l19-54 32 112 31-74 24 35 27-19h199"/><path d="M765 238h386" opacity=".35"/><g fill="currentColor" stroke="none"><circle cx="819" cy="158" r="5"/><circle cx="838" cy="104" r="5"/><circle cx="870" cy="216" r="5"/><circle cx="901" cy="142" r="5"/><circle cx="952" cy="158" r="5"/></g></g>
